name: Bug report
description: Report reproducible behavior that is not working as intended.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For security vulnerabilities, follow SECURITY.md instead of opening a public issue.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [Backend, Daemon, Dashboard, Docker/deployment, Documentation]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include expected behavior, actual behavior, and exact reproduction steps.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: EasyPanel commit/version, OS, browser, .NET/Node versions, and deployment method.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove passwords, JWTs, node tokens, domains, and other sensitive values first.
      render: shell
